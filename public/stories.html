<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Super-Hero Sprint: Story Cards</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Bangers|Indie+Flower&display=swap" />
  <style>
    @page { size: letter; margin: 0.5in; }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: #111;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .instructions {
      max-width: 7.5in;
      margin: 1em auto;
      padding: 0.75em 1em;
      background: #fff8d6;
      border: 2px solid #e0c200;
      border-radius: 8px;
    }

    .page {
      width: 7.5in;
      height: 10in;
      margin: 0 auto 0.5in;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: repeat(4, 1fr);
      break-after: page;
    }
    .page:last-child { break-after: auto; }

    /* Dashed lines are the cut lines */
    .card {
      border: 1px dashed #999;
      padding: 0.18in;
      display: flex;
      flex-direction: column;
      gap: 0.08in;
      overflow: hidden;
    }

    .role {
      align-self: flex-start;
      font-family: 'Bangers', Impact, sans-serif;
      font-size: 15pt;
      letter-spacing: 1px;
      color: #fff;
      padding: 0 0.12in;
      border-radius: 4px;
    }
    .hero .role { background: #1565c0; }
    .villain .role { background: #b71c1c; }
    .sidekick .role { background: #6a1b9a; }
    .marketer .role { background: #2e7d32; }

    .story {
      font-size: 12pt;
      line-height: 1.3;
      margin: 0;
    }
    .story b { font-weight: 700; }

    .done {
      font-size: 9.5pt;
      line-height: 1.3;
      margin: 0;
      color: #333;
    }
    .done code {
      font-size: 9pt;
      background: #eee;
      padding: 0 3px;
      border-radius: 3px;
    }

    .footer {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      font-size: 10pt;
      font-weight: bold;
    }
    .blank {
      display: inline-block;
      border-bottom: 1px solid #111;
      min-width: 0.5in;
    }
    .footer .owner .blank { min-width: 1.6in; }

    @media print {
      .instructions { display: none; }
      .page { margin: 0; }
    }
  </style>
</head>
<body>
  <div class="instructions">
    <b>Printing:</b> Letter paper, scale 100%, turn on <i>Background graphics</i>.
    Cut along the dashed lines. This box won't print.
  </div>

  <main id="cards"></main>

  <script>
    // [role, story, done when]
    const stories = [
      ["hero", "As a <b>super-hero</b> I need <b>a cool name</b> so that people want to hear stories about me.",
        "The name is in <code>name</code> and shows on the hero page."],
      ["hero", "As a <b>super-hero</b> I need <b>an origin story</b> so that I have a reason to be like I am.",
        "A few sentences about how the hero got their powers are in <code>backstory</code>."],
      ["hero", "As a <b>super-hero</b> I need <b>powers</b> so that I can defeat villains.",
        "At least 2 powers are listed in <code>stats.powers</code>."],
      ["hero", "As a <b>super-hero</b> I need <b>weaknesses</b> so that readers can have a sense of fear for me.",
        "At least 1 weakness is listed in <code>stats.weaknesses</code>."],
      ["hero", "As a <b>super-hero</b> I need <b>a look</b> (skin, hair, gender, costume) so that people can identify me.",
        "Gender, skin, hair and costume colour are picked from the options screen."],
      ["hero", "As a <b>super-hero</b> I need <b>a sidekick</b> because I can't always do it on my own.",
        "The sidekick shows up on the hero page."],

      ["villain", "As a <b>super-villain</b> I need <b>a cool name</b> to strike fear into the hearts of everyone.",
        "The name is in <code>associations.enemy.name</code> and shows as the Arch-Nemesis."],
      ["villain", "As a <b>super-villain</b> I need <b>an origin story</b> so that I have a reason to be like I am.",
        "A few sentences are in <code>associations.enemy.backstory</code>."],
      ["villain", "As a <b>super-villain</b> I need <b>a goal</b> so that I have something evil to accomplish.",
        "The villain's evil plan is written into <code>associations.enemy.backstory</code>."],
      ["villain", "As a <b>super-villain</b> I need <b>powers</b> so that I can take over the world (or whatever my goal is).",
        "At least 2 powers are listed in <code>associations.enemy.stats.powers</code>."],
      ["villain", "As a <b>super-villain</b> I need <b>weaknesses</b> so that I can be beaten.",
        "At least 1 weakness is listed in <code>associations.enemy.stats.weaknesses</code>."],
      ["villain", "As a <b>super-villain</b> I need <b>a look</b> (skin, hair, gender, costume) so that people can identify me.",
        "Gender, skin, hair and costume colour in <code>associations.enemy</code> are picked from the options screen."],

      ["sidekick", "As a <b>sidekick</b> I need <b>a cool name</b> so that people want to hear stories about me.",
        "The name is in <code>associations.sidekick.name</code> and shows on the hero page."],
      ["sidekick", "As a <b>sidekick</b> I need <b>an origin story</b> so that I have a reason to be like I am.",
        "A few sentences are in <code>associations.sidekick.backstory</code>."],
      ["sidekick", "As a <b>sidekick</b> I need <b>powers</b> so that I can help defeat villains.",
        "At least 1 power is listed in <code>associations.sidekick.stats.powers</code>."],
      ["sidekick", "As a <b>sidekick</b> I need <b>weaknesses</b> so that readers can have a sense of fear for me.",
        "At least 1 weakness is listed in <code>associations.sidekick.stats.weaknesses</code>."],
      ["sidekick", "As a <b>sidekick</b> I need <b>a look</b> (skin, hair, gender, costume) so that people can identify me.",
        "Gender, skin, hair and costume colour in <code>associations.sidekick</code> are picked from the options screen."],

      ["marketer", "As a <b>marketer</b> I need <b>a social media presence</b> so that I can market our upcoming super-hero.",
        "The hero page shows the name, look, powers, weaknesses, sidekick, arch-nemesis and backstory."],
      ["marketer", "As a <b>marketer</b> I need <b>our first comic book cover</b> so that I can really get people excited.",
        "The Copilot prompt from the hero page makes a cover we show at the demo."],
    ];

    const roleNames = { hero: "Super-Hero", villain: "Super-Villain", sidekick: "Sidekick", marketer: "Marketing" };
    const perPage = 8;
    const main = document.getElementById("cards");

    for (let i = 0; i < stories.length; i += perPage) {
      const page = document.createElement("section");
      page.className = "page";
      page.innerHTML = stories.slice(i, i + perPage).map(([role, story, done]) => `
        <div class="card ${role}">
          <span class="role">${roleNames[role]}</span>
          <p class="story">${story}</p>
          <p class="done"><b>Done when:</b> ${done}</p>
          <div class="footer">
            <span>Points: <span class="blank"></span></span>
            <span class="owner">Who: <span class="blank"></span></span>
          </div>
        </div>`).join("");
      main.appendChild(page);
    }
  </script>
</body>
</html>
